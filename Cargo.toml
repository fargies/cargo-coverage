[package]
name = "cargo-coverage"
version = "1.0.0"
authors = ["Keith T. Star <uberfoo@me.com>", "Sylvain Fargier <fargier.sylvain@gmail.com>"]
categories = ["command-line-utilities", "development-tools::cargo-plugins"]
description = "A Cargo plugin for generating code coverage data."
documentation = "https://github.com/fargies/cargo-coverage"
homepage = "https://github.com/fargies/cargo-coverage"
include = ["src/**/*.rs", "README.md", "LICENSE-APACHE", "LICENSE-MIT"]
keywords = ["code-coverage", "cargo", "rust"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/fargies/cargo-coverage"
edition = "2024"

[[bin]]
name = "cargo-cover"
path = "src/main.rs"

[dependencies]
ansi_term = "0.12.1"
regex = "1.11.1"

[package.metadata.release]
pre-release-hook = ["git", "cliff", "-o", "ChangeLog.md", "--tag", "{{version}}" ]
